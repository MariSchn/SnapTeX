# Benchmark configurations.
#
# Every [run.<name>] block is one thing you can benchmark:
#     uv run bench/run.py <name>
#
# Keys:
#   engine      "ollama" (native /api/chat, full options block) or "openai"
#               (/v1/chat/completions - mlx-vlm, llama-server, vLLM, cloud APIs)
#   base_url    server root, no trailing /v1
#   model       model name as the server knows it
#   max_px      downscale the image so its longest side is at most this, client
#               side, before sending. Omit to send the screenshot untouched.
#   keep_alive  ollama only, how long to hold the model in memory
#   options     ollama: the native options block (num_ctx, num_predict, ...)
#               openai: merged into the request body (temperature, max_tokens)
#   prompt_id   which entry from [prompts] below to send
#
# Anything not set on a run block falls back to [defaults], then to the
# [defaults.<engine>] block for that engine - the two engines take different
# option names, so they get separate defaults.
#
# To add your own model: copy a block, change the name and model, run it.

[defaults]
engine = "ollama"
timeout = 300
prompt_id = "baseline"

[defaults.ollama]
base_url = "http://127.0.0.1:11434"
keep_alive = "10m"

[defaults.ollama.options]
temperature = 0
seed = 0
num_predict = 256
# Ollama otherwise allocates the model's full advertised context - 262144 for
# qwen3-vl, which is 24 GB of KV cache for a 3.3 GB model. A screenshot is
# ~1100 prompt tokens, so 8192 is already generous.
num_ctx = 8192

[defaults.openai]
base_url = "http://127.0.0.1:8081"

[defaults.openai.options]
temperature = 0
max_tokens = 256


# --- prompts ---------------------------------------------------------------

[prompts]
baseline = "Convert this equation to LaTeX. Output ONLY the raw LaTeX string."

terse = "Transcribe this equation as LaTeX."

strict = """
Transcribe the equation in this image as LaTeX.
Output the LaTeX only: no $ delimiters, no code fences, no explanation.
"""

# Nudges the model straight into the answer instead of a preamble.
prefill = "Equation to LaTeX. Answer with the LaTeX body only, nothing else."


# --- model sweep -----------------------------------------------------------
# Default (Q4_K_M-ish) weights, everything else held constant.

[run.qwen3vl-2b]
model = "qwen3-vl:2b-instruct"

[run.qwen3vl-4b]
model = "qwen3-vl:4b-instruct"

[run.qwen3vl-8b]
model = "qwen3-vl:8b-instruct"

[run.qwen35-2b]
model = "qwen3.5:2b"

[run.qwen35-4b]
model = "qwen3.5:4b"

[run.qwen35-9b]
model = "qwen3.5:9b"

[run.gemma4-e2b]
model = "gemma4:e2b-it-qat"

[run.gemma4-e4b]
model = "gemma4:e4b-it-qat"

[run.ministral3-3b]
model = "ministral-3:3b"

[run.ministral3-8b]
model = "ministral-3:8b"

[run.glm-ocr]
model = "glm-ocr:latest"

[run.deepseek-ocr-3b]
model = "deepseek-ocr:3b"


# --- inference engine ------------------------------------------------------
# Same weights, different runtime. Start the server first:
#   python -m mlx_vlm.server --model <repo> --port 8081

[run.mlx-qwen3vl-2b-4bit]
engine = "openai"
model = "mlx-community/Qwen3-VL-2B-Instruct-4bit"

[run.mlx-qwen3vl-4b-4bit]
engine = "openai"
model = "lmstudio-community/Qwen3-VL-4B-Instruct-MLX-4bit"

[run.mlx-qwen3vl-4b-8bit]
engine = "openai"
model = "lmstudio-community/Qwen3-VL-4B-Instruct-MLX-8bit"

[run.mlx-qwen3vl-8b-4bit]
engine = "openai"
model = "lmstudio-community/Qwen3-VL-8B-Instruct-MLX-4bit"
