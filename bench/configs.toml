# Benchmark configurations.
#
# Every [run.<name>] block is one thing you can benchmark:
#     uv run bench/run.py <name>
#
# Keys:
#   engine      "ollama" (native /api/chat, full options block) or "openai"
#               (/v1/chat/completions - mlx-vlm, llama-server, vLLM, cloud APIs)
#   base_url    server root, no trailing /v1
#   model       model name as the server knows it
#   max_px      downscale the image so its longest side is at most this, client
#               side, before sending. Omit to send the screenshot untouched.
#   keep_alive  ollama only, how long to hold the model in memory
#   options     ollama: the native options block (num_ctx, num_predict, ...)
#               openai: merged into the request body (temperature, max_tokens)
#   prompt_id   which entry from [prompts] below to send
#
# Anything not set on a run block falls back to [defaults], then to the
# [defaults.<engine>] block for that engine - the two engines take different
# option names, so they get separate defaults.
#
# To add your own model: copy a block, change the name and model, run it.

[defaults]
engine = "ollama"
timeout = 300
prompt_id = "baseline"

[defaults.ollama]
base_url = "http://127.0.0.1:11434"
keep_alive = "10m"

[defaults.ollama.options]
temperature = 0
seed = 0
num_predict = 256
# Ollama otherwise allocates the model's full advertised context - 262144 for
# qwen3-vl, which is 24 GB of KV cache for a 3.3 GB model. A screenshot is
# ~1100 prompt tokens, so 8192 is already generous.
num_ctx = 8192

[defaults.openai]
base_url = "http://127.0.0.1:8081"

[defaults.openai.options]
temperature = 0
max_tokens = 256


# --- prompts ---------------------------------------------------------------

[prompts]
baseline = "Convert this equation to LaTeX. Output ONLY the raw LaTeX string."

terse = "Transcribe this equation as LaTeX."

strict = """
Transcribe the equation in this image as LaTeX.
Output the LaTeX only: no $ delimiters, no code fences, no explanation.
"""

# Nudges the model straight into the answer instead of a preamble.
prefill = "Equation to LaTeX. Answer with the LaTeX body only, nothing else."


# --- model sweep -----------------------------------------------------------
# Default (Q4_K_M-ish) weights, everything else held constant.

[run.qwen3vl-2b]
model = "qwen3-vl:2b-instruct"

[run.qwen3vl-4b]
model = "qwen3-vl:4b-instruct"

[run.qwen3vl-8b]
model = "qwen3-vl:8b-instruct"

# qwen3.5 is a hybrid reasoning model; thinking has to be off or it spends the
# whole budget deliberating over a one-line transcription.
[run.qwen35-2b]
model = "qwen3.5:2b"
think = false

[run.qwen35-4b]
model = "qwen3.5:4b"
think = false

[run.qwen35-9b]
model = "qwen3.5:9b"
think = false

# gemma4 is another hybrid reasoning model - same story as qwen3.5.
[run.gemma4-e2b]
model = "gemma4:e2b-it-qat"
think = false

[run.gemma4-e4b]
model = "gemma4:e4b-it-qat"
think = false

[run.ministral3-3b]
model = "ministral-3:3b"

[run.ministral3-8b]
model = "ministral-3:8b"

# glm-ocr is a full-page document OCR model: it transcribes the equation
# correctly and then keeps re-emitting it in fenced blocks until it runs out of
# budget. A stop sequence is the difference between 0.23 and a real score.
[run.glm-ocr]
model = "glm-ocr:latest"

[run.glm-ocr.options]
stop = ["\n```", "\n$$"]

[run.deepseek-ocr-3b]
model = "deepseek-ocr:3b"


# --- inference engine ------------------------------------------------------
# Same weights, different runtime. Start the server first:
#   python -m mlx_vlm.server --model <repo> --port 8081

[run.mlx-qwen3vl-2b-4bit]
engine = "openai"
model = "mlx-community/Qwen3-VL-2B-Instruct-4bit"

[run.mlx-qwen3vl-4b-4bit]
engine = "openai"
model = "lmstudio-community/Qwen3-VL-4B-Instruct-MLX-4bit"

[run.mlx-qwen3vl-4b-8bit]
engine = "openai"
model = "lmstudio-community/Qwen3-VL-4B-Instruct-MLX-8bit"

[run.mlx-qwen3vl-8b-4bit]
engine = "openai"
model = "lmstudio-community/Qwen3-VL-8B-Instruct-MLX-4bit"


# --- image resolution ------------------------------------------------------
# Ollama pins every image to a fixed ~1080-token grid, so this does nothing
# there. mlx-vlm does real dynamic resolution: pixels in, visual tokens out.
# Upscaling a small screenshot is how you buy detail back.

[run.mlx-4b-px512]
engine = "openai"
model = "lmstudio-community/Qwen3-VL-4B-Instruct-MLX-4bit"
min_px = 512

[run.mlx-4b-px768]
engine = "openai"
model = "lmstudio-community/Qwen3-VL-4B-Instruct-MLX-4bit"
min_px = 768

[run.mlx-4b-px1024]
engine = "openai"
model = "lmstudio-community/Qwen3-VL-4B-Instruct-MLX-4bit"
min_px = 1024

[run.mlx-4b-px1536]
engine = "openai"
model = "lmstudio-community/Qwen3-VL-4B-Instruct-MLX-4bit"
min_px = 1536

[run.mlx-2b-px768]
engine = "openai"
model = "mlx-community/Qwen3-VL-2B-Instruct-4bit"
min_px = 768

[run.mlx-2b-px1024]
engine = "openai"
model = "mlx-community/Qwen3-VL-2B-Instruct-4bit"
min_px = 1024

[run.mlx-2b-px1536]
engine = "openai"
model = "mlx-community/Qwen3-VL-2B-Instruct-4bit"
min_px = 1536

[run.mlx-2b-px2048]
engine = "openai"
model = "mlx-community/Qwen3-VL-2B-Instruct-4bit"
min_px = 2048

[run.mlx-4b-8bit-px1024]
engine = "openai"
model = "lmstudio-community/Qwen3-VL-4B-Instruct-MLX-8bit"
min_px = 1024


# --- serving parameters ----------------------------------------------------
# num_ctx is the memory dial, not a speed dial: Ollama allocates the model's
# full advertised context (262144 for qwen3-vl) unless told otherwise, which
# is 24 GB of KV cache for a 3.3 GB model.

[run.ctx-default]
model = "qwen3-vl:2b-instruct"
[run.ctx-default.options]
num_ctx = 262144

[run.ctx-32k]
model = "qwen3-vl:2b-instruct"
[run.ctx-32k.options]
num_ctx = 32768

[run.ctx-4k]
model = "qwen3-vl:2b-instruct"
[run.ctx-4k.options]
num_ctx = 4096

[run.ctx-2k]
model = "qwen3-vl:2b-instruct"
[run.ctx-2k.options]
num_ctx = 2048

# A wrong answer that arrives fast still costs you a retry, but an unbounded
# one costs you the whole token budget. 128 is comfortably above the longest
# reference in the corpus.
[run.predict-128]
model = "glm-ocr:latest"
[run.predict-128.options]
num_predict = 128
stop = ["\n```", "\n$$"]

[run.predict-96]
model = "glm-ocr:latest"
[run.predict-96.options]
num_predict = 96
stop = ["\n```", "\n$$"]


# --- prompt ----------------------------------------------------------------

[run.prompt-terse]
model = "qwen3-vl:2b-instruct"
prompt_id = "terse"

[run.prompt-strict]
model = "qwen3-vl:2b-instruct"
prompt_id = "strict"

[run.prompt-prefill]
model = "qwen3-vl:2b-instruct"
prompt_id = "prefill"

[run.glm-prompt-terse]
model = "glm-ocr:latest"
prompt_id = "terse"
[run.glm-prompt-terse.options]
stop = ["\n```", "\n$$"]

[run.glm-prompt-strict]
model = "glm-ocr:latest"
prompt_id = "strict"
[run.glm-prompt-strict.options]
stop = ["\n```", "\n$$"]


# --- quantization ----------------------------------------------------------
# Same weights at different precision. Note glm-ocr:latest is already bf16.

[run.qwen3vl-2b-q8]
model = "qwen3-vl:2b-instruct-q8_0"

[run.qwen3vl-2b-bf16]
model = "qwen3-vl:2b-instruct-bf16"

[run.glm-ocr-q8]
model = "glm-ocr:q8_0"
[run.glm-ocr-q8.options]
stop = ["\n```", "\n$$"]

[run.gemma4-e2b-q4km]
model = "gemma4:e2b-it-q4_K_M"
think = false


# --- server flags ----------------------------------------------------------
# OLLAMA_FLASH_ATTENTION and OLLAMA_KV_CACHE_TYPE are set on the server, not
# per request, so these point at a second instance started with:
#   OLLAMA_HOST=127.0.0.1:11500 OLLAMA_FLASH_ATTENTION=1 \
#   OLLAMA_KV_CACHE_TYPE=q8_0 ollama serve

[run.flashattn-qwen3vl-2b]
model = "qwen3-vl:2b-instruct"
base_url = "http://127.0.0.1:11500"

[run.flashattn-glm-ocr]
model = "glm-ocr:q8_0"
base_url = "http://127.0.0.1:11500"
[run.flashattn-glm-ocr.options]
stop = ["\n```", "\n$$"]

[run.glm-ocr-q8-ctx2k]
model = "glm-ocr:q8_0"
[run.glm-ocr-q8-ctx2k.options]
num_ctx = 2048
stop = ["\n```", "\n$$"]

[run.glm-ocr-q8-ctx1k]
model = "glm-ocr:q8_0"
[run.glm-ocr-q8-ctx1k.options]
num_ctx = 1024
stop = ["\n```", "\n$$"]

[run.mlx-glm-ocr-4bit]
engine = "openai"
model = "mlx-community/GLM-OCR-4bit"
[run.mlx-glm-ocr-4bit.options]
stop = ["\n```", "\n$$"]

[run.mlx-glm-ocr-8bit]
engine = "openai"
model = "mlx-community/GLM-OCR-8bit"
[run.mlx-glm-ocr-8bit.options]
stop = ["\n```", "\n$$"]
